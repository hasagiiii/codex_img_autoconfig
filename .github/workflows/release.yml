name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish GitHub Release
        run: npm run release:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    needs: release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build macOS DMG and ZIP artifacts
        run: npm run build:mac

      - name: Verify macOS artifacts
        run: |
          test -n "$(find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -print -quit)"
          find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -print

      - name: Upload macOS artifacts to the tagged release
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
